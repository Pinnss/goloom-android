# Семвер версия Goloom Android.
# Меняем тут перед каждым релизом. CI читает то же значение и тегирует
# git как `v$VERSION`, апплоадит APK как `goloom-v$VERSION.apk` в GitHub
# Release. UpdateChecker сравнивает с этим тегом.
#
# versionCode (Android internal) выводится автоматически:
#   MAJOR*10000 + MINOR*100 + PATCH
# Этого хватает на 99 patch'ей в minor'е и 99 minor'ов в major'е.
VERSION=0.2.1
