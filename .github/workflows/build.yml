name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # нужен для создания Release при пуше тега

env:
  GO_VERSION: '1.25.5'
  JAVA_VERSION: '17'
  NDK_VERSION: '26.1.10909125'
  # Подавляем checklinkname-ошибку Go 1.25 — wlynxg/anet через pion/transport
  # пока ещё использует linkname к net.zoneCache. См. HANDOFF.md.
  GOFLAGS: '-ldflags=-checklinkname=0'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout android repo
        uses: actions/checkout@v4

      # SDK живёт в отдельном репо. Для CI собираем .aar из его main-ветки.
      - name: Checkout goloom-poc (Go SDK)
        uses: actions/checkout@v4
        with:
          repository: Sv9toslavPinigin/goloom-poc
          path: goloom-poc
          ref: main
          token: ${{ secrets.GOLOOM_POC_TOKEN || github.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: goloom-poc/go.sum

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;${{ env.NDK_VERSION }}'

      - name: Install gomobile
        working-directory: goloom-poc
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build goloom.aar
        working-directory: goloom-poc
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          GOLOOM_TARGETS: 'android/arm64,android/arm'
        run: |
          chmod +x mobile/scripts/build-android.sh
          mobile/scripts/build-android.sh

      - name: Copy .aar into android project
        run: |
          mkdir -p app/libs
          cp goloom-poc/build/android/goloom.aar app/libs/goloom.aar

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run tests
        run: ./gradlew --no-daemon test

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Read version
        id: ver
        run: echo "version=$(grep '^VERSION=' version.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             "goloom-v${{ steps.ver.outputs.version }}.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: goloom-v${{ steps.ver.outputs.version }}-apk
          path: goloom-v${{ steps.ver.outputs.version }}.apk
          retention-days: 30

      # На тегах v* — создаём GitHub Release и аплоадим APK туда. Тег
      # должен совпадать с version.properties (CI это не валидирует, чтобы
      # не блокировать срочные релизы — следим вручную).
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: goloom-v${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
